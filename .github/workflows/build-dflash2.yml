# ==============================================================================
# GitHub Actions: Build llama.cpp DFlash2 (PR #27342) Docker images
#
# 浜у嚭 3 涓暅鍍忥紝鎺ㄩ€佸埌 ghcr.io锛?#   - llama-dflash2:cuda       CUDA 12.9, 澶氭灦鏋?(rapids)
#   - llama-dflash2:cuda-75    CUDA 12.9, Turing 鏋舵瀯 (2080Ti/T4)
#   - llama-dflash2:cpu        绾?CPU
#
# 瑙﹀彂鏂瑰紡锛?#   - push 鍒?master/main 鍒嗘敮锛堟敼鍔?Dockerfile 鎴?workflow 鏃讹級
#   - 鎵嬪姩 workflow_dispatch锛堝彲閫?CUDA_ARCH銆佹槸鍚︽帹閫侊級
#   - 瀹氭椂姣忓懆涓€鏋勫缓锛堜繚鎸佷笌涓婃父鍚屾锛?#
# 鍓嶇疆鏉′欢锛?#   1. 鎶婃鐩綍鎺ㄩ€佸埌浣犵殑 GitHub 浠撳簱
#   2. 鍦ㄤ粨搴?Settings > Actions > General 鍕鹃€?"Allow GitHub Actions to create
#      and approve pull requests"锛堝彲閫夛級
#   3. 纭 GITHUB_TOKEN 鏈?packages:write 鏉冮檺锛堥粯璁ゅ凡鏈夛級
# ==============================================================================

name: Build DFlash2 Docker Images

on:
  push:
    branches: [master, main]
    paths:
      - 'Dockerfile.cuda'
      - 'Dockerfile.cpu'
      - '.github/workflows/build-dflash2.yml'
  workflow_dispatch:
    inputs:
      cuda_arch:
        description: 'CUDA 鏋舵瀯 (75=2080Ti, 89=4090, rapids=澶氭灦鏋?'
        required: false
        default: 'rapids'
      push_image:
        description: '鎺ㄩ€侀暅鍍忓埌 ghcr.io'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    # 姣忓懆涓€ UTC 02:00 鑷姩鏋勫缓锛堜繚鎸佷笌涓婃父 dflash2 鍒嗘敮鍚屾锛?    - cron: '0 2 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================================================
  # Job 1: CUDA 闀滃儚锛堝鏋舵瀯 + 鐗瑰畾鏋舵瀯骞惰锛?  # ==========================================================================
  build-cuda:
    name: CUDA (${{ matrix.cuda_arch_label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_arch: "rapids"
            cuda_arch_label: "multi-arch"
            tag_suffix: "cuda"
          - cuda_arch: "75"
            cuda_arch_label: "turing-2080Ti"
            tag_suffix: "cuda-75"
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repo name for image
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}
          tags: |
            type=raw,value=${{ matrix.tag_suffix }}
            type=raw,value=${{ matrix.tag_suffix }}-{{date 'YYYYMMDD'}}
            type=sha,prefix=${{ matrix.tag_suffix }}-

      - name: Build & push CUDA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA_ARCH=${{ matrix.cuda_arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          echo "### CUDA Build: ${{ matrix.cuda_arch_label }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Architecture: \`${{ matrix.cuda_arch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Job 2: CPU 闀滃儚
  # ==========================================================================
  build-cpu:
    name: CPU-only
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repo name for image
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}
          tags: |
            type=raw,value=cpu
            type=raw,value=cpu-{{date 'YYYYMMDD'}}
            type=sha,prefix=cpu-

      - name: Build & push CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cpu
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          echo "### CPU Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Job 3: 鐢熸垚 README 闀滃儚鍒楄〃 (鍙€?
  # ==========================================================================
  update-readme:
    name: Update README badges
    runs-on: ubuntu-22.04
    needs: [build-cuda, build-cpu]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase repo name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate package info
        run: |
          echo "### Docker Images Published" > package-info.md
          echo "" >> package-info.md
          echo "| Image | Tag | Pull Command |" >> package-info.md
          echo "|-------|-----|-------------|" >> package-info.md
          echo "| CUDA (multi-arch) | \`cuda\`, \`cuda-YYYYMMDD\` | \`docker pull ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:cuda\` |" >> package-info.md
          echo "| CUDA (Turing 2080Ti) | \`cuda-75\`, \`cuda-75-YYYYMMDD\` | \`docker pull ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:cuda-75\` |" >> package-info.md
          echo "| CPU-only | \`cpu\`, \`cpu-YYYYMMDD\` | \`docker pull ${{ env.Registry }}/${{ steps.repo.outputs.name }}:cpu\` |" >> package-info.md
          echo "" >> package-info.md
          echo "*Auto-updated: $(date -u)*" >> package-info.md

      - name: Show info
        run: cat package-info.md
