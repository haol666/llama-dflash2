# ==============================================================================
# GitHub Actions: Build llama.cpp DFlash2 (PR #27342) Docker images
#
# Outputs 3 images to ghcr.io:
#   - llama-dflash2:cuda       CUDA 12.9, multi-arch (75;80;86;89;90)
#   - llama-dflash2:cuda-75    CUDA 12.9, Turing arch (2080Ti/T4)
#   - llama-dflash2:cpu        CPU-only
#
# Triggers:
#   - push to main/master (when Dockerfile or workflow changes)
#   - manual workflow_dispatch
#   - weekly schedule (sync upstream dflash2 branch)
# ==============================================================================

name: Build DFlash2 Docker Images

on:
  push:
    branches: [master, main]
    paths:
      - 'Dockerfile.cuda'
      - 'Dockerfile.cpu'
      - '.github/workflows/build-dflash2.yml'
  workflow_dispatch:
    inputs:
      cuda_arch:
        description: 'CUDA arch (75=2080Ti, 89=4090, 75;80;86;89;90=multi-arch)'
        required: false
        default: '75;80;86;89;90'
      push_image:
        description: 'Push image to ghcr.io'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    # Weekly build every Monday UTC 02:00
    - cron: '0 2 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================================================
  # Job 1: CUDA images (multi-arch + turing, parallel)
  # ==========================================================================
  build-cuda:
    name: CUDA (${{ matrix.cuda_arch_label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_arch: "75;80;86;89;90"
            cuda_arch_label: "multi-arch"
            tag_suffix: "cuda"
          - cuda_arch: "75"
            cuda_arch_label: "turing-2080Ti"
            tag_suffix: "cuda-75"
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repo name for image
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}
          tags: |
            type=raw,value=${{ matrix.tag_suffix }}
            type=raw,value=${{ matrix.tag_suffix }}-{{date 'YYYYMMDD'}}
            type=sha,prefix=${{ matrix.tag_suffix }}-

      - name: Build & push CUDA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA_ARCH=${{ matrix.cuda_arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          echo "### CUDA Build: ${{ matrix.cuda_arch_label }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Architecture: \`${{ matrix.cuda_arch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Job 2: CPU-only image
  # ==========================================================================
  build-cpu:
    name: CPU-only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repo name for image
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}
          tags: |
            type=raw,value=cpu
            type=raw,value=cpu-{{date 'YYYYMMDD'}}
            type=sha,prefix=cpu-

      - name: Build & push CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cpu
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          echo "### CPU Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

